<!DOCTYPE html> 
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ring of Fire – Kort</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #090909, #1c1028, #120817);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 28px;
      padding: 60px 25px 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      backdrop-filter: blur(12px);
      text-align: center;
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: 14px;
      left: 18px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 24px;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 18px;
    }

    .card {
      height: 285px;
      border-radius: 24px;
      background: #f7f3ea;
      color: #151515;
      border: 5px solid rgba(255,255,255,0.9);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin-bottom: 18px;
      transition: 0.25s;
      box-shadow: 
        0 18px 50px rgba(0,0,0,0.45),
        inset 0 0 0 2px rgba(0,0,0,0.08);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 2px solid rgba(0,0,0,0.12);
      border-radius: 18px;
      pointer-events: none;
    }

    .card.red {
      color: #d01835;
    }

    .card.black {
      color: #111;
    }

    .corner {
      position: absolute;
      font-weight: 900;
      line-height: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .corner.top-left {
      top: 18px;
      left: 18px;
    }

    .corner.bottom-right {
      bottom: 18px;
      right: 18px;
      transform: rotate(180deg);
    }

    .corner-value {
      font-size: 24px;
    }

    .corner-suit {
      font-size: 25px;
    }

    .big-suit {
      font-size: 74px;
      margin-bottom: 5px;
      text-shadow: 0 6px 14px rgba(0,0,0,0.12);
    }

    .value {
      font-size: 58px;
      font-weight: 900;
      margin-bottom: 2px;
      letter-spacing: -2px;
    }

    .title {
      font-size: 23px;
      font-weight: 900;
      margin-bottom: 10px;
      color: #111;
    }

    .rule {
      font-size: 15px;
      color: #333;
      padding: 0 35px;
      line-height: 1.45;
    }

    .card-back {
      background: radial-gradient(circle at top, #ff4fd8, #8e44ff 45%, #241039);
      color: white;
      border: 5px solid rgba(255,255,255,0.85);
    }

    .card-back::after {
      content: "♠ ♥ ♦ ♣";
      position: absolute;
      font-size: 32px;
      letter-spacing: 10px;
      opacity: 0.22;
      transform: rotate(-20deg);
    }

    .card-back .title,
    .card-back .rule {
      color: white;
      position: relative;
      z-index: 2;
    }

    .card-back .value {
      position: relative;
      z-index: 2;
      font-size: 64px;
    }

    .card.flip {
      animation: flip 0.6s ease;
    }

    .counter {
      margin-top: 10px;
      font-size: 13px;
      color: #aaa;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #ffcf5a, #ff6b6b);
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    .secondary {
      margin-top: 10px;
      background: rgba(255,255,255,0.12);
      color: white;
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 15px;
    }

    footer {
      margin-top: 18px;
      font-size: 12px;
      color: #777;
      text-align: center;
      max-width: 430px;
      line-height: 1.5;
    }

    @keyframes flip {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(90deg); }
      100% { transform: rotateY(360deg); }
    }
  </style>
</head>

<body>

  <div class="app">

    <a href="ringoffire.html" class="back-btn">←</a>

    <h1>🔥 Trekk kort</h1>

    <div class="card card-back" id="card" onclick="drawCard()">
      <div class="value" id="value">🃏</div>
      <div class="title" id="title">Trykk for å starte</div>
      <div class="rule" id="rule">Trekk et kort og følg regelen</div>
    </div>

    <button onclick="drawCard()">Trekk kort</button>
    <button class="secondary" onclick="resetDeck()">Start på nytt</button>

    <div class="counter" id="counter">52 kort igjen</div>

  </div>

  <footer>
    Drikk ansvarlig. 18+. VorsZone oppfordrer ikke til overdrevent alkoholforbruk.
  </footer>

  <script>
    const cardRules = [
      {v:"A", t:"Waterfall", r:"Alle kan drikke samtidig."},
      {v:"2", t:"Du drikker", r:"Kan ta 2 slurker."},
      {v:"3", t:"Del ut", r:"Kan gi bort 2 slurker."},
      {v:"4", t:"Jenter", r:"Alle jenter kan drikke."},
      {v:"5", t:"Tommelmester", r:"Sistemann med tommel på bordet kan drikke."},
      {v:"6", t:"Gutter", r:"Alle gutter kan drikke."},
      {v:"7", t:"Heaven", r:"Sistemann med hånden opp kan drikke."},
      {v:"8", t:"Mate", r:"Velg en drikkepartner."},
      {v:"9", t:"Rim", r:"Taper kan drikke."},
      {v:"10", t:"Kategori", r:"Taper kan drikke."},
      {v:"J", t:"Regel", r:"Lag en regel."},
      {v:"Q", t:"Spørsmål", r:"Kun spørsmål."},
      {v:"K", t:"Kopp", r:"Hell i glasset."}
    ];

    const suits = [
      { symbol: "♥", color: "red" },
      { symbol: "♦", color: "red" },
      { symbol: "♠", color: "black" },
      { symbol: "♣", color: "black" }
    ];

    let deck = [];

    function buildDeck() {
      deck = [];

      for (let rule of cardRules) {
        for (let suit of suits) {
          deck.push({
            v: rule.v,
            t: rule.t,
            r: rule.r,
            suit: suit.symbol,
            color: suit.color
          });
        }
      }

      updateCounter();
    }

    function drawCard() {
      if (deck.length === 0) {
        document.getElementById("title").innerHTML = "Tom kortstokk";
        document.getElementById("rule").innerHTML = "Trykk start på nytt for å spille igjen.";
        return;
      }

      const cardEl = document.getElementById("card");
      cardEl.classList.remove("flip");
      void cardEl.offsetWidth;
      cardEl.classList.add("flip");

      setTimeout(() => {
        let i = Math.floor(Math.random() * deck.length);
        let c = deck[i];
        deck.splice(i, 1);

        cardEl.classList.remove("card-back", "red", "black");
        cardEl.classList.add(c.color);

        cardEl.innerHTML = `
          <div class="corner top-left">
            <div class="corner-value">${c.v}</div>
            <div class="corner-suit">${c.suit}</div>
          </div>

          <div class="big-suit">${c.suit}</div>
          <div class="value">${c.v}</div>
          <div class="title">${c.t}</div>
          <div class="rule">${c.r}</div>

          <div class="corner bottom-right">
            <div class="corner-value">${c.v}</div>
            <div class="corner-suit">${c.suit}</div>
          </div>
        `;

        updateCounter();
      }, 250);
    }

    function updateCounter() {
      document.getElementById("counter").innerHTML = deck.length + " kort igjen";
    }

    function resetDeck() {
      buildDeck();

      const cardEl = document.getElementById("card");
      cardEl.classList.remove("red", "black");
      cardEl.classList.add("card-back");

      cardEl.innerHTML = `
        <div class="value" id="value">🃏</div>
        <div class="title" id="title">Trykk for å starte</div>
        <div class="rule" id="rule">Trekk et kort og følg regelen</div>
      `;
    }

    buildDeck();
  </script>

</body>
</html>
